services:
  postgres:
    image: postgres:17-alpine
    container_name: web-plugins-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webplugins
      POSTGRES_PASSWORD: webplugins
      POSTGRES_DB: webplugins
    ports:
      - '5433:5432'
    volumes:
      - web-plugins-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webplugins -d webplugins']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-plugins-pgdata:
